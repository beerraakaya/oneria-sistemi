# Bu dosyayı "ayarlar.toml" adıyla kopyalayıp kendi bilgisayarınıza göre düzenleyin.
# ayarlar.toml git'e gönderilmez. Yazmadığınız ayarlar varsayılan değerleriyle kalır.
#
# Windows yollarını tek tırnakla yazın: 'C:\Users\ad\Desktop\oneri.xlsx'

# Öneri Excel'inin bilgisayarınızdaki kopyası
excel_yolu = 'veri/oneri.xlsx'

# Ollama'da yüklü modeller ("ollama list" ile görebilirsiniz)
dil_modeli = 'qwen2.5'
gomme_modeli = 'bge-m3'

# --- Canlı kullanım (SharePoint) ---
# Excel'in SharePoint adresi: dosyayı SharePoint'te bulun, "..." > "Ayrıntılar" >
# "Yol" yanındaki kopyala düğmesiyle alın. Boş bırakılırsa excel_yolu'ndaki dosyaya yazılır.
# sharepoint_dosya_adresi = 'https://sirket.sharepoint.com/sites/SiteAdi/Shared Documents/Klasor/Oneri.xlsx'
# Nasıl yazılacağı: 'graph' (IT'nin verdiği uygulama izniyle) ya da 'excel' (bu bilgisayardaki
# Excel uygulamasıyla, Excel'de oturum açmış hesabın yetkisiyle; IT izni gerekmez).
# yazma_yontemi = 'graph'
# 'graph' yönteminde IT'nin verdiği bilgiler:
# graph_kiraci = '00000000-0000-0000-0000-000000000000'
# graph_uygulama = '00000000-0000-0000-0000-000000000000'
# Gizli anahtar buraya değil, ONERI_GRAPH_SIRRI ortam değişkenine yazılmalı (README'ye bakın).

# Diğer ayarlar ve varsayılanları:
# sayfa_adi = 'Genel Tablo'
# fabrika = 'Denizli'
# kurallar_yolu = 'kurallar.md'
# veri_klasoru = 'veri'
# ollama_adresi = 'http://localhost:11434'
# baglam_uzunlugu = 12288
# sicaklik = 0.0
# tohum = 42
# en_fazla_token = 800
# model_bekleme_suresi = '40m'
# red_kontrolu = true
# ornek_sayisi = 8
# komsu_sayisi = 7
# karma_esigi = 5
# en_kisa_degerlendirme = 40
# kalip_tekrar_esigi = 3
# onay_gun_sayisi = 7
# en_fazla_oneri = 20
# taslak_rengi = '#FFF2CC'
